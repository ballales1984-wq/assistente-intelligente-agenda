services:
  - type: web
    name: assistente-intelligente
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: assistente-db
          property: connectionString
      - key: OLLAMA_HOST
        value: ""
      - key: OLLAMA_MODEL
        value: "llama3.2"
      - key: CORS_ORIGINS
        value: "https://agenda-angular-livid.vercel.app,http://localhost:4200"
      - key: DEBUG
        value: "false"

databases:
  - name: assistente-db
    region: frankfurt
    plan: free
    databaseName: agenda_db
    user: agenda_user
